name: Code Quality Check

on:
  push:
    branches:
      - master

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check Python syntax
        run: |
          python -m py_compile classification/train.py
          python -m py_compile classification/train_video.py
          python -m py_compile classification/evaluate.py
          python -m py_compile classification/app.py
          echo "All files passed syntax check!"
